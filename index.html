  --canvas:#F5F6F8; --surface:#FFFFFF; --surface2:#FCFCFD;
  --bord:#E4E7EC; --bord-fort:#D0D5DD;
  --t1:#101828; --t2:#475467; --t3:#98A2B3;
  --prim:#B84800; --prim-vif:#9A3B00; --prim-tint:#FFF2E8; --prim-bord:#FFC08A;
  --marque:#FF7200;
  --bleu:#175CD3; --bleu-tint:#EFF4FF; --bleu-bord:#B2CCFF;
  --vert:#067647; --vert-tint:#ECFDF3; --vert-bord:#ABEFC6;
  --ambre:#93700A; --ambre-tint:#FEFBEA; --ambre-bord:#F7DF8C;
  --rouge:#B42318; --rouge-tint:#FEF3F2; --rouge-bord:#FECDCA;
  --ardoise:#1C1613;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --ombre:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --ombre-md:0 4px 8px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --ombre-xl:0 20px 24px -4px rgba(16,24,40,.10),0 8px 8px -4px rgba(16,24,40,.04);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--prim-bord);outline-offset:1px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}

.demarrage{min-height:100dvh;background:var(--ardoise);display:grid;place-content:center;justify-items:center;gap:22px}
.demarrage .marque-logo{width:min(62vw,290px)}
.demarrage p{color:#8A7A70;font-size:13px;letter-spacing:.1em;text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite}
.auth{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.auth-recit{background:var(--ardoise);display:grid;place-items:center;padding:40px;position:relative}
.auth-recit::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--marque)}
.auth-recit .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.auth-recit .logo i{width:30px;height:30px;border-radius:8px;background:var(--prim-vif);display:grid;place-items:center;font-style:normal;font-size:15px}
.auth-recit h2{font-size:29px;line-height:1.25;letter-spacing:-.02em;font-weight:700;max-width:15ch;margin-bottom:14px}
.auth-recit p{color:#98A2B3;font-size:14.5px;max-width:42ch;line-height:1.6}
.auth-recit ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:11px}
.auth-recit li{display:flex;gap:10px;color:#D0D5DD;font-size:13.5px;align-items:flex-start}
.auth-recit li b{color:#fff;font-weight:600}
.auth-recit .puce{color:#7C7CF0;flex:none}
.auth-recit .bas{font-size:11.5px;color:#667085;line-height:1.6}
.marque-logo{width:min(64%,340px);aspect-ratio:560/490;background:var(--logo) center/contain no-repeat}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 30px;overflow-y:auto}
.auth-boite{width:100%;max-width:388px}
.auth-boite h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px}
.auth-boite .sous{color:var(--t2);font-size:14px;margin-bottom:26px}
.auth-boite .champs{display:flex;flex-direction:column;gap:14px}
.auth-boite .btn{width:100%;justify-content:center;padding:11px}
.auth-liens{margin-top:19px;font-size:13.5px;color:var(--t2);display:flex;flex-direction:column;gap:7px}
.auth-liens a{color:var(--prim);font-weight:600;cursor:pointer;text-decoration:none}
.auth-liens a:hover{text-decoration:underline}
.msg-err{background:var(--rouge-tint);border:1px solid var(--rouge-bord);color:var(--rouge);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
.msg-ok{background:var(--vert-tint);border:1px solid var(--vert-bord);color:var(--vert);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
.jauge{height:5px;border-radius:3px;background:var(--bord);overflow:hidden;margin-top:6px}
.jauge i{display:block;height:100%;transition:width .2s}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-recit{display:none}}

.app{display:grid;grid-template-columns:246px minmax(0,1fr);height:100dvh}
.rail{background:var(--surface);border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow-y:auto}
.rail{border-top:3px solid var(--marque)}
.rail .marque{padding:15px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bord)}
.rail .marque .logo{width:128px;height:34px;background:var(--logo) center/contain no-repeat}
.rail .marque i{width:30px;height:30px;border-radius:8px;background:var(--prim);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.rail .marque span{font-size:11px;color:var(--t3);font-weight:500;display:block;letter-spacing:.02em}
.rail nav{padding:11px 9px;flex:1}
.rail .titre-grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:13px 8px 5px}
.rail nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:8px;color:var(--t2);font-size:13.5px;font-weight:500;text-align:left;margin-bottom:1px}
.rail nav button:hover{background:var(--canvas);color:var(--t1)}
.rail nav button[aria-current=page]{background:var(--prim-tint);color:var(--prim);font-weight:600;box-shadow:inset 3px 0 0 var(--marque)}
.rail nav button[disabled]{opacity:.4;cursor:not-allowed}
.rail nav button[disabled]:hover{background:none;color:var(--t2)}
.rail nav .ic{width:17px;text-align:center;flex:none;font-size:13px}
.rail nav .pip{margin-left:auto;background:var(--rouge);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:19px;text-align:center}
.rail nav .pip.calme{background:var(--bord);color:var(--t2)}
.rail .pied{border-top:1px solid var(--bord);padding:11px}
.compte-mini{display:flex;align-items:center;gap:9px;padding:7px;border-radius:8px}
.compte-mini:hover{background:var(--canvas)}
.avatar{width:33px;height:33px;border-radius:50%;background:var(--prim);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.compte-mini .id{min-width:0;flex:1}
.compte-mini .id b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compte-mini .id span{display:block;font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    if(src) ops.push({type:"liste",nom:n,items:src});

  if(enAttente.audit.length) ops.push({type:"audit",items:enAttente.audit.slice(0,40)});

const LIMITE_DOC=4200000;
const photosMem={};
function lireFichier(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function chargerImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function preparerFichier(f){
  const brut=await lireFichier(f);
  if(f.type==="application/pdf"){
    if(brut.length>LIMITE_DOC) throw new Error("PDF trop lourd ("+ko(f.size)+"). Réduisez la qualité du scan.");
    return {dataUrl:brut, type:"application/pdf", vignette:"", taille:brut.length};
  }
  const img=await chargerImage(brut);
  const dessine=(maxPx,q)=>{
    const r=Math.min(1,maxPx/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",q);
  };
  const mob=surMobile();
  let g=dessine(mob?1300:1700,mob?.66:.74);
  if(g.length>LIMITE_DOC) g=dessine(mob?1050:1250,mob?.58:.62);
  if(g.length>LIMITE_DOC) g=dessine(mob?800:950,mob?.48:.5);
  return {dataUrl:g, type:"image/jpeg", vignette:dessine(110,.45), taille:g.length};
}

  meta._brut=(aStockage||syncActif)?null:p.dataUrl;

function detailTR(c){
  const nbT=ent(c.nbTR), mt=arrondi(nb(c.montantTR)), z=arrondi(nb(c.trZ));
  return {nb:nbT, physique:mt, z, ecart:arrondi(mt-z), moyenne:nbT?arrondi(mt/nbT):0};
}
function detailCV(c){
  const nbT=ent(c.nbCV), mt=arrondi(nb(c.montantCV)), z=arrondi(nb(c.cvZ));
  return {nb:nbT, physique:mt, z, ecart:arrondi(mt-z), moyenne:nbT?arrondi(mt/nbT):0};
}
function ecartComptage(c){
  const t=detailTR(c), v=detailCV(c), cb=arrondi(nb(c.cb)-nb(c.cbZ));
  const anormal=arrondi((t.ecart<0?-t.ecart:0)+(v.ecart<0?-v.ecart:0)+Math.abs(cb));
  const boni=arrondi((t.ecart>0?t.ecart:0)+(v.ecart>0?v.ecart:0));
  return {tr:t.ecart, cv:v.ecart, cb, boni, anormal, net:arrondi(t.ecart+v.ecart+cb),
    abs:arrondi(Math.abs(t.ecart)+Math.abs(v.ecart)+Math.abs(cb))};
}
let gen=0;
const _b={}, _p={}, _c={};
let _gen=-1;
function purgerCaches(){
  if(_gen===gen) return;
  for(const k in _b) delete _b[k]; for(const k in _p) delete _p[k];
  for(const k in _c) delete _c[k]; for(const k in _f) delete _f[k];
  _gen=gen;
}
function bilan(iso){ purgerCaches(); return _b[iso]||(_b[iso]=calcBilan(iso)); }
function calcBilan(iso){
  const d=journee(iso);
  const ouv=d.ouverture?nb(d.ouverture.montant):0, fer=d.fermeture?nb(d.fermeture.montant):0;
  const ret=nb(d.retrait.montant), app=nb(d.apport);
  const especesReelles=d.fermeture?arrondi(fer-ouv-app+ret):0;
  const ecartEspeces=d.fermeture?arrondi(especesReelles-nb(d.especesZ)):0;
  let tr=0,cv=0,cb=0,trZ=0,cvZ=0,cbZ=0,abs=0,net=0,anormal=0,boni=0,nTR=0,nCV=0;
  d.comptages.forEach(c=>{
    const t=detailTR(c), v=detailCV(c), e=ecartComptage(c);
    tr+=t.physique; cv+=v.physique; cb+=nb(c.cb); trZ+=t.z; cvZ+=v.z; cbZ+=nb(c.cbZ);
    nTR+=t.nb; nCV+=v.nb; abs+=e.abs; net+=e.net; anormal+=e.anormal; boni+=e.boni;
  });
  const tpe=arrondi(nb(d.tpe1)+nb(d.tpe2));
  const cx=nb(d.canaux.cc)+nb(d.canaux.borne)+nb(d.canaux.uber)+nb(d.canaux.deliveroo);
  return {ouv,fer,ret,app,especesReelles,ecartEspeces,
    tr:arrondi(tr),cv:arrondi(cv),cb:arrondi(cb),trZ:arrondi(trZ),cvZ:arrondi(cvZ),cbZ:arrondi(cbZ),
    nTR,nCV,canaux:arrondi(cx), tpe, ecartTPE:arrondi(tpe-cb),
    caReel:arrondi(tr+cv+cb+especesReelles+cx), caTheo:arrondi(trZ+cvZ+cbZ+nb(d.especesZ)+cx),
    ecartCaisses:arrondi(abs), ecartNet:arrondi(net+ecartEspeces),
    anormal:arrondi(anormal+Math.abs(ecartEspeces)), boni:arrondi(boni),
    aJustifier:arrondi(Math.abs(ecartEspeces)+abs)};
}

const PHOTOS=[

function montantPhoto(iso,cible){
  const d=journee(iso), b=bilan(iso);
  return {"inv-matin":d.ouverture?nb(d.ouverture.montant):0,
          "inv-soir":d.fermeture?nb(d.fermeture.montant):0,
          "z-global":b.caTheo, "tpe1":nb(d.tpe1), "tpe2":nb(d.tpe2)}[cible]||0;
}
function pointsControle(iso){ purgerCaches(); return _p[iso]||(_p[iso]=calcPoints(iso)); }
function calcPoints(iso){
  const d=journee(iso);
  return PHOTOS.map(ph=>{
    const docs=docsDe(d.justificatifs,ph.cible), ctrl=d.controles[ph.cible]||null;
    let etat="manquant";
    if(docs.length) etat=ctrl?(ctrl.etat==="conforme"?"conforme":"refuse"):"averifier";
    const oblige = ph.cible==="tpe2" ? P.deuxTPE : true;
    return Object.assign({},ph,{id:ph.cible, montant:montantPhoto(iso,ph.cible),
      oblige, docs, ctrl, etat, jour:iso});
  }).filter(p=>p.cible!=="tpe2"||P.deuxTPE);
}
function controleComplet(iso){ purgerCaches(); return _c[iso]||(_c[iso]=calcControle(iso)); }
function calcControle(iso){
  const pts=pointsControle(iso).filter(p=>p.oblige);
  return {total:pts.length, ok:pts.filter(p=>p.etat==="conforme").length,
    manquants:pts.filter(p=>p.etat==="manquant"), refuses:pts.filter(p=>p.etat==="refuse"),
    attente:pts.filter(p=>p.etat==="averifier")};
}
function etapeComptage(c){
  if(c.valid) return "valide";

  if(c.verif) return "verifie";

}

const _f={};
function fileComptages(filtre){ purgerCaches(); return _f[filtre]||(_f[filtre]=calcFile(filtre)); }
function calcFile(filtre){
  const out=[];
  Object.keys(J).sort().reverse().forEach(k=>{
    (J[k].comptages||[]).forEach(c=>{
      const e=etapeComptage(c);
      if(filtre==="tous"||filtre===e) out.push({jour:k, c, etape:e});

}

function errAuth(m){ authErr=m; authOk=""; peindre(); }
async function actionsAuth(id){
  const v=x=>{ const e=document.getElementById(x); return e?e.value:""; };
  const go=(e,pre)=>{ ecranAuth=e; authErr=""; authOk=""; authPre=pre||{}; peindre(); };
  if(id==="a-local"){ modeLocalAccepte=true; return go("connexion"); }
  if(id==="a-inscription") return go("inscription");
  if(id==="a-installer") return go("installation");
  if(id==="a-oubli") return go("oubli",{mail:v("l-mail")});
  if(id==="a-retour") return go("connexion");

  if(id==="b-base"){
    const url=v("bs-url").trim(), cle=v("bs-cle").trim();
    if(!url) return errAuth("Collez l'adresse du script Google.");
    const anc=Object.assign({},cfgServeur);
    cfgServeur={url,cle};
    const b=document.getElementById("b-base"); if(b){ b.disabled=true; b.textContent="Connexion…"; }
    try{
      await tirerTout(); syncActif=true;
      await ecrireLocal("caisse:serveur",cfgServeur);
      ecranAuth="connexion"; authErr=""; authOk=""; peindre();
    }catch(ex){ cfgServeur=anc; syncActif=false; errAuth("Connexion impossible : "+ex.message); }
    return;
  }
  if(id==="b-installer"){
    const nom=v("i-nom").trim(), mail=v("i-mail").trim(), mdp=v("i-mdp"), rep=v("i-rep").trim();
    if(!nom) return errAuth("Indiquez votre nom.");
    if(!emailOK(mail)) return errAuth("Adresse e-mail invalide.");
    if(mdp.length<10) return errAuth("Le mot de passe doit faire au moins 10 caractères.");
    if(mdp!==v("i-mdp2")) return errAuth("Les deux mots de passe ne correspondent pas.");
    if(!rep) return errAuth("La réponse de secours est obligatoire.");
    if(!codeMaitreOK(v("i-code"))) return errAuth("Code maître incorrect.");
    await creerCompte({nom,email:mail,role:"Administrateur",mdp,question:v("i-q"),reponse:rep});
    authOk="Compte créé. Connectez-vous."; ecranAuth="connexion"; authPre={mail}; return peindre();
  }
  if(id==="b-inscrire"){
    const nom=v("s-nom").trim(), mail=v("s-mail").trim(), role=v("s-role"), mdp=v("s-mdp"), rep=v("s-rep").trim();
    if(!nom) return errAuth("Indiquez votre nom.");
    if(!emailOK(mail)) return errAuth("Adresse e-mail invalide.");
    if(parEmail(mail)) return errAuth("Un compte existe déjà avec cette adresse.");
    if(mdp.length<10) return errAuth("Le mot de passe doit faire au moins 10 caractères.");
    if(mdp!==v("s-mdp2")) return errAuth("Les deux mots de passe ne correspondent pas.");
    if(!rep) return errAuth("La réponse de secours est obligatoire.");
    if(role==="Administrateur"&&!codeMaitreOK(v("s-code"))) return errAuth("Code maître incorrect.");
    if(role!=="Administrateur"&&!P.inscriptionLibre) return errAuth("La création libre de comptes est fermée.");
    await creerCompte({nom,email:mail,role,mdp,question:v("s-q"),reponse:rep});
    authOk="Compte créé. Connectez-vous."; ecranAuth="connexion"; authPre={mail}; return peindre();
  }
  if(id==="b-connexion"){
    const mail=v("l-mail").trim(), c=parEmail(mail);
    if(!c||deriver(v("l-mdp"),c.sel)!==c.hMdp){
      AUDIT.unshift({at:maintenant(),qui:mail||"—",role:"—",action:"Connexion refusée",detail:"Identifiants incorrects"});
      await ecrire(CLES.a,AUDIT);
      return errAuth("E-mail ou mot de passe incorrect.");
    }
    if(c.actif===false) return errAuth("Ce compte a été désactivé.");
    return ouvrirSession(c);
  }
  if(id==="b-oubli1"){
    const c=parEmail(v("o-mail").trim());
    if(!c) return errAuth("Aucun compte avec cette adresse.");
    authPre={mail:c.email, etape:2}; authErr=""; return peindre();
  }
  if(id==="b-oubli2"){
    const c=parEmail(authPre.mail);
    if(sha256(SEL+"rep|"+v("o-rep").trim().toLowerCase())!==c.hReponse) return errAuth("Réponse incorrecte.");
    if(RANG[c.role]>=2&&!codeMaitreOK(v("o-code"))) return errAuth("Code maître incorrect.");
    const mdp=v("o-mdp");
    if(mdp.length<10) return errAuth("Le mot de passe doit faire au moins 10 caractères.");
    if(mdp!==v("o-mdp2")) return errAuth("Les deux mots de passe ne correspondent pas.");
    c.sel=selAleatoire(); c.hMdp=deriver(mdp,c.sel); c.mdpChangeLe=maintenant();
    await ecrire(CLES.c,COMPTES);
    AUDIT.unshift({at:maintenant(),qui:c.nom,role:c.role,action:"Mot de passe réinitialisé",detail:c.email});
    await ecrire(CLES.a,AUDIT);
    authOk="Mot de passe modifié."; ecranAuth="connexion"; authPre={mail:c.email}; return peindre();
  }
}

async function creerCompte(o){
  const sel=selAleatoire();
  const c={id:uid(), nom:o.nom, email:o.email.toLowerCase(), role:o.role, sel, hMdp:deriver(o.mdp,sel),
    question:o.question, hReponse:sha256(SEL+"rep|"+o.reponse.toLowerCase()), actif:true, creeLe:maintenant(), dernierAcces:""};
  COMPTES.push(c);
  await ecrire(CLES.c,COMPTES);
  AUDIT.unshift({at:maintenant(),qui:o.nom,role:o.role,action:"Compte créé",detail:o.email+" · "+o.role});
  await ecrire(CLES.a,AUDIT);
  return c;
}

      const col=e=>e<-0.004?"var(--rouge)":(e>0.004?"var(--bleu)":"var(--t2)");

        '<td class="n" style="font-weight:700;font-size:15px">'+x.nbCV+'</td><td class="n">'+eur(x.papCV)+'</td>'+
        '<td class="n" style="font-weight:600;color:'+col(eV)+'">'+signe(eV)+' €</td></tr>';

    '<td class="n">'+b.nTR+'</td><td class="n">'+eur(b.tr-Object.values(parC).reduce((s,x)=>s+x.demTR,0))+'</td>'+

    '<td class="n">'+signe(b.tr-b.trZ)+' €</td><td class="n">'+b.nCV+'</td><td class="n">'+eur(b.cv)+'</td>'+
    '<td class="n">'+signe(b.cv-b.cvZ)+' €</td></tr>'+

      ligRap("Titres-restaurant ("+b.nTR+" titres)",b.tr,b.trZ)+ligRap("Chèques-vacances ("+b.nCV+" titres)",b.cv,b.cvZ)+
      ligRap("Carte bancaire",b.cb,b.cbZ)+ligRap("Espèces",b.especesReelles,nb(d.especesZ))+
      '<tr><td>Canaux externes</td><td class="n">'+eur(b.canaux)+'</td><td class="n">'+eur(b.canaux)+'</td><td class="n">—</td><td></td></tr>'+

      '</tbody></table></div>';
  }
  return h;
}
function ligRap(nom,reel,theo){
  const e=arrondi(reel-theo);
  const nat=e<-0.004?'<span class="pil ko">Manquant</span>':(e>0.004?'<span class="pil prim">Excédent</span>':'<span class="pil ok">Juste</span>');
  return '<tr><td>'+nom+'</td><td class="n">'+eur(reel)+'</td><td class="n">'+eur(theo)+'</td><td class="n">'+signe(e)+' €</td><td>'+nat+'</td></tr>';
}

function vueValidation(){
  if(!fileComptages(filtreValid).length){
    const ordre=estAdmin()?["verifie","saisi","renvoye","valide"]:["saisi","renvoye","verifie","valide"];
    const alt=ordre.find(f=>fileComptages(f).length);
    if(alt&&alt!==filtreValid){ filtreValid=alt; indexValid=0; pieceActive=""; }
  }
  const liste=fileComptages(filtreValid);
  if(indexValid>=liste.length) indexValid=Math.max(0,liste.length-1);
  const item=liste[indexValid]||null;

  const onglets=[["saisi","À vérifier"],["verifie","À valider"],["renvoye","Renvoyés"],["valide","Validés"],["tous","Toutes"]];
  const barre='<div class="valid-outils">'+
    onglets.map(([k,l])=>'<button data-filtre="'+k+'"'+(filtreValid===k?' style="background:var(--prim);color:#fff"':'')+'>'+
      l+(compteurEtape(k)?" · "+compteurEtape(k):"")+'</button>').join("")+
    '<span class="esp"></span>'+
    (item?'<span class="compteur">'+(indexValid+1)+' / '+liste.length+'</span>'+
      '<button data-nav="-1"'+(indexValid<=0?" disabled":"")+'>‹ Préc.</button>'+
      '<button data-nav="1"'+(indexValid>=liste.length-1?" disabled":"")+'>Suiv. ›</button>'+
      '<button data-zoom="-1">−</button><button data-zoom="0">100 %</button><button data-zoom="1">+</button><button data-rot="1">⟳</button>'
      :'<span class="compteur">Aucune caisse</span>')+

  if(!item) return '<div class="valid"><div class="valid-gauche">'+barre+
    '<div class="valid-vue"><p class="rien">Aucune caisse dans cette file.</p></div></div>'+
    '<div class="valid-droite"><div class="tete"><h3>Rien à contrôler</h3><p>File vide sur ce filtre.</p></div>'+
    '<div class="flux"></div></div></div>';

  return '<div class="valid"><div class="valid-gauche">'+barre+

    '<div class="valid-droite">'+panneauCaisse(item)+'</div></div>';

function panneauCaisse(item){
  const {jour:iso,c,etape}=item;
  const d=journee(iso);

  const pieces=pointsControle(iso);
  const cloture=!!d.cloture;

  const tete='<div class="tete"><h3>'+ech(c.caisse)+' — '+ech(c.service)+'</h3>'+
    '<p>'+jolieDate(iso)+' · '+pilEtape(etape)+'</p>'+
    (c.renvoi?'<p class="aide" style="margin-top:6px;color:var(--rouge)">Renvoyé par '+ech(c.renvoi.par)+' le '+heureCourte(c.renvoi.at)+' : '+ech(c.renvoi.note)+'</p>':"")+
    (c.verif?'<p class="aide" style="margin-top:6px">Vérifié par '+ech(c.verif.par)+' · '+heureCourte(c.verif.at)+'</p>':"")+
    (c.valid?'<p class="aide" style="margin-top:3px">Validé par '+ech(c.valid.par)+' · '+heureCourte(c.valid.at)+'</p>':"")+
    '</div>';

  let f='';

  f+='<div class="bloc"><h4>Rapprochement</h4>'+
    ligneRap("Titres-restaurant",t.physique,t.z)+
    ligneRap("Chèques-vacances",v.physique,v.z)+
    ligneRap("Carte bancaire",nb(c.cb),nb(c.cbZ))+
    paire("Manquant réel",eur(e.anormal), e.anormal>0?"fort ko":"fort ok")+
    paire("Excédent non-rendu",eur(e.boni), e.boni>0?"fort prim":"fort")+
  '</div>';

  f+='<div class="bloc"><h4>Titres déclarés</h4>'+
    paire("Titres-restaurant",t.nb+" titres · "+eur(t.physique))+
    paire("Chèques-vacances",v.nb+" titres · "+eur(v.physique))+
    paire("Valeur moyenne TR",t.nb?eur(t.moyenne):"—")+'</div>';

  f+='<div class="bloc"><h4>Photos de la journée</h4>';
  pieces.forEach(p=>{
    f+='<div class="piece-ligne"><div class="pl-vign" data-piece="'+ech(p.id)+'"'+
      (p.docs[0]?(function(x){var b=x.vignette||lienDirect(x,220);return b?' style="background-image:url('+b+')"':'';})(p.docs[0]):'')+'>'+
      (p.docs.length?(p.docs[0].type==="application/pdf"?"PDF":""):"—")+'</div>'+
      '<div class="pl-id"><b>'+ech(p.libelle)+'</b><span>'+eur(p.montant)+(p.oblige?"":" · facultatif")+'</span>'+
      (p.ctrl&&p.ctrl.note?'<span style="color:var(--rouge)">'+ech(p.ctrl.note)+'</span>':"")+'</div>'+
      '<div class="pl-act">'+pil(p.etat)+
      (!cloture&&p.docs.length&&estManager()?'<span class="pl-btns">'+
        '<button class="btn vert mini" data-piece-ok="'+ech(p.id)+'">✓</button>'+
        '<button class="btn rouge mini" data-piece-ko="'+ech(p.id)+'">✕</button></span>':"")+
      '</div></div>';
  });
  f+='</div>';

  f+='<div class="bloc"><h4>Origine</h4>'+
    paire("Opérateur",ech(c.operateur||"—"))+
    paire("Vérifiée par",ech(c.verif?c.verif.par:"en attente"))+
    paire("Horaires",(c.h1||"--:--")+" → "+(c.h2||"--:--"))+
    paire("Saisi le",heureCourte(c.at))+
  '</div>';
  if(c.motif) f+='<div class="bloc"><h4>Motif saisi par l\'équipe</h4><div class="bulle">'+ech(c.motif)+'</div></div>';

  const fil=MESSAGES.filter(m=>m.comptageId===c.id).sort((a,b)=>a.at.localeCompare(b.at));
  if(fil.length) f+='<div class="bloc"><h4>Échanges</h4><div class="fil">'+fil.map(m=>
    '<div class="bulle'+(m.resolu?"":" refus")+'"><div class="qui"><b>'+ech(m.de)+' → '+ech(m.pour)+'</b><span>'+heureCourte(m.at)+'</span></div>'+ech(m.texte)+
    (m.reponses||[]).map(r=>'<div class="bulle reponse" style="margin-top:7px"><div class="qui"><b>'+ech(r.de)+'</b><span>'+heureCourte(r.at)+'</span></div>'+ech(r.texte)+'</div>').join("")+
    '</div>').join("")+'</div></div>';

  let pied='';
  if(cloture) pied='<div class="pied"><span class="aide">Journée clôturée : plus aucune modification.</span></div>';
  else if(!estManager()) pied='<div class="pied"><span class="aide">Seul un manager ou un administrateur peut contrôler une caisse.</span></div>';
  else if(etape==="valide") pied='<div class="pied">'+
    (estAdmin()?'<button class="btn neutre" data-caisse="devalider">Annuler la validation</button>':'<span class="aide">Caisse validée.</span>')+'</div>';
  else if(etape==="verifie") pied='<div class="pied">'+
    '<button class="btn rouge" data-caisse="renvoyer">Renvoyer</button>'+
    (estAdmin()?'<button class="btn vert" data-caisse="valider">Valider la caisse</button>'
      :'<span class="aide" style="flex:1;text-align:center">En attente d\'un administrateur pour la validation finale.</span>')+'</div>';
  else {
    const pret=pretAVerifier(iso,c);
    pied='<div class="pied"><button class="btn rouge" data-caisse="renvoyer">Renvoyer à l\'équipier</button>'+
      '<button class="btn'+(estAdmin()?"":" vert")+'" data-caisse="verifier"'+(pret?"":" disabled")+'>'+
      (estAdmin()?"Vérifier et valider":"Vérifier la caisse")+'</button></div>'+
      (pret?"":'<p class="aide" style="padding:0 17px 12px">Pointez d\'abord les photos de la journée.</p>');
  }
  return tete+'<div class="flux">'+f+'</div>'+pied;
}
function ligneRap(nom,reel,theo){
  const e=arrondi(reel-theo);
  return paire(nom, eur(reel)+" / "+eur(theo)+"  <b>"+signe(e)+" €</b>", e<-0.004?"ko":(e>0.004?"prim":"ok"));
}
function paire(a,b,cl){ return '<div class="paire '+(cl||"")+'"><span>'+a+'</span><span>'+b+'</span></div>'; }

let visuAffiche="";
async function chargerVisu(force){
  const liste=fileComptages(filtreValid), item=liste[indexValid];
  const el=document.getElementById("visu"); if(!el||!item) return;
  const pieces=pointsControle(item.jour).filter(p=>p.docs.length);
  if(!pieces.length){ el.innerHTML='<p class="rien">Aucune photo jointe à ce comptage. Renvoyez-le à l\'équipier.</p>'; return; }
  const p=pieces.find(x=>x.id===pieceActive)||pieces[0];
  pieceActive=p.id;
  const doc=p.docs[0];
  const empreinteVue=doc.id+"|"+zoomValid+"|"+rotValid;
  if(!force&&visuAffiche===empreinteVue&&el.querySelector("img,iframe")) return;
  visuAffiche=empreinteVue;
  const style='transform:scale('+zoomValid+') rotate('+(rotValid*90)+'deg)';
  const rapide=photosMem[doc.id]||doc._brut||(doc.type!=="application/pdf"?lienDirect(doc,1600):"");
  if(rapide){
    el.innerHTML='<img src="'+rapide+'" alt="'+ech(p.libelle)+'" style="'+style+'">';
    const im=el.querySelector("img");
    im.onerror=async()=>{
      const d2=await ouvrirDoc(doc.id,doc);
      if(d2) im.src=d2; else el.innerHTML='<p class="rien">Pièce introuvable.</p>';
    };
    return;
  }
  const data=await ouvrirDoc(doc.id,doc);
  if(!data){ el.innerHTML='<p class="rien">Pièce introuvable dans le stockage.</p>'; return; }
  el.innerHTML=(doc.type==="application/pdf"
    ? '<iframe src="'+data+'" title="Justificatif"></iframe>'
    : '<img src="'+data+'" alt="'+ech(p.libelle)+'" style="'+style+'">');
}

function blocTitres(pfx,titre,kNb,kMt,kZ,c,calc){

function problemesComptage(c){
  const p=[], e=ecartComptage(c), t=detailTR(c), v=detailCV(c);
  if(!c.operateur) p.push("Indiquez qui a tenu la caisse.");
  if(!c.h1||!c.h2) p.push("Renseignez les horaires du service.");
  if(t.nb>0&&!nb(c.montantTR)) p.push("Saisissez le montant total des titres-restaurant.");
  if(nb(c.montantTR)>0&&!t.nb) p.push("Saisissez le nombre de titres-restaurant.");
  if(v.nb>0&&!nb(c.montantCV)) p.push("Saisissez le montant total des chèques-vacances.");
  if(nb(c.montantCV)>0&&!v.nb) p.push("Saisissez le nombre de chèques-vacances.");
  if(e.abs>0&&!String(c.motif).trim()) p.push("Un écart de "+eur(e.abs)+" doit être justifié par écrit.");
  return p;
}

function problemesFermeture(f,montant){
  const p=[], d=journee(jour), cc=controleComplet(jour);
  if(!montant) p.push("Saisissez le total du monnayeur.");
  if(!f.especesZ) p.push("Saisissez le total espèces du ticket Z.");
  if(!f.par) p.push("Indiquez qui a fait la fermeture.");
  if(!nb(f.tpe1)) p.push("Saisissez la télécollecte du TPE 1.");
  if(P.deuxTPE&&!nb(f.tpe2)) p.push("Saisissez la télécollecte du TPE 2.");
  if(nb(f.retrait.montant)>0&&!f.retrait.bordereau) p.push("Le n° de bordereau est obligatoire dès qu'il y a un retrait.");
  const sm=d.comptages.filter(c=>ecartComptage(c).abs>0&&!c.motif).length;
  if(sm) p.push(sm+" comptage(s) avec un écart non justifié.");
  if(cc.manquants.length) p.push(cc.manquants.length+" pièce(s) obligatoire(s) manquante(s).");
  if(cc.attente.length) p.push(cc.attente.length+" pièce(s) en attente de validation.");
  const nonValidees=(d.comptages||[]).filter(c=>etapeComptage(c)!=="valide");
  if(nonValidees.length) p.push(nonValidees.length+" caisse(s) pas encore validée(s) par un administrateur.");
  if(!(d.comptages||[]).length) p.push("Aucun comptage enregistré pour cette journée.");
  return p;
}

function mouvementsTitres(du,au){
  let cTR=0,mTR=0,cCV=0,mCV=0;
  Object.keys(J).forEach(k=>{
    if(du&&k<du) return; if(au&&k>au) return;
    (J[k].comptages||[]).forEach(c=>{ cTR+=ent(c.nbTR); mTR+=nb(c.montantTR); cCV+=ent(c.nbCV); mCV+=nb(c.montantCV); });
  });
  let rTRn=0,rTRm=0,rCVn=0,rCVm=0;
  REMISES.forEach(r=>{
    if(du&&r.dateEnvoi<du) return; if(au&&r.dateEnvoi>au) return;
    if(r.type==="TR"){ rTRn+=ent(r.nbTitres); rTRm+=nb(r.montant); } else { rCVn+=ent(r.nbTitres); rCVm+=nb(r.montant); }
  });
  return {colTRn:cTR, colTRm:arrondi(mTR), colCVn:cCV, colCVm:arrondi(mCV),
          remTRn:rTRn, remTRm:arrondi(rTRm), remCVn:rCVn, remCVm:arrondi(rCVm)};
}
function bornesPeriode(){
  const d=new Date(jour+"T12:00:00");
  if(periode==="jour") return {du:jour, au:jour, titre:jolieDate(jour)};
  if(periode==="semaine"){
    const n=(d.getDay()+6)%7;
    const lun=decale(jour,-n), dim=decale(lun,6);
    return {du:lun, au:dim, titre:"Semaine du "+courteDate(lun)+" au "+courteDate(dim)};
  }
  if(periode==="annee"){
    const a=jour.slice(0,4);
    return {du:a+"-01-01", au:a+"-12-31", titre:"Année "+a};
  }
  const m=jour.slice(0,7);
  const fin=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();
  const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  return {du:m+"-01", au:m+"-"+String(fin).padStart(2,"0"), titre:MOIS[Number(m.slice(5,7))-1]+" "+m.slice(0,4)};
}
function joursPeriode(){
  const b=bornesPeriode();
  return Object.keys(J).filter(k=>k>=b.du&&k<=b.au).sort();
}
function barrePeriode(){
  const b=bornesPeriode();
  return '<div class="carte"><div class="corps periode">'+
    [["jour","Journée"],["semaine","Semaine"],["mois","Mois"],["annee","Année"]].map(([k,l])=>
      '<button class="btn '+(periode===k?"":"neutre ")+'mini" data-act="periode" data-p="'+k+'">'+l+'</button>').join("")+
    '<span class="periode-titre">'+ech(b.titre)+'</span>'+
    '<span class="aide" style="margin-left:auto">'+joursPeriode().length+' journée(s)</span>'+

}

function colonnesJournal(){
  const b=bornesPeriode(), cols=[];
  if(periode==="annee"){
    const an=jour.slice(0,4);
    const M=["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    for(let m=1;m<=12;m++){
      const mm=an+"-"+String(m).padStart(2,"0");
      const fin=new Date(Number(an),m,0).getDate();
      const js=[]; for(let i=1;i<=fin;i++){ const k=mm+"-"+String(i).padStart(2,"0"); if(journeeExiste(k)) js.push(k); }
      cols.push({t:M[m-1], s:an.slice(2), jours:js, vide:!js.length});
    }
    return cols;
  }
  let k=b.du, garde=0;
  while(k<=b.au&&garde++<400){
    cols.push({t:k.slice(8), s:["D","L","M","M","J","V","S"][new Date(k+"T12:00:00").getDay()],
      jours:journeeExiste(k)?[k]:[], vide:!journeeExiste(k), cle:k});
    k=decale(k,1);
  }
  return cols;
}

    if(!c.jours.length) return '<td class="n pale">—</td>';

function vueAnalyse(){
  const cles=joursPeriode();
  if(!cles.length) return barrePeriode()+'<div class="carte"><div class="vide"><b>Rien à analyser sur cette période</b></div></div>';
  let ca=0,anormal=0,boni=0,nClo=0,nTR=0,nCV=0;
  const parPers={}, parCaisse={};
  cles.forEach(k=>{
    const b=bilan(k), d=J[k];
    ca+=b.caReel; anormal+=b.anormal; boni+=b.boni; nTR+=b.nTR; nCV+=b.nCV;
    if(d.cloture) nClo++;
    d.comptages.forEach(c=>{
      const e=ecartComptage(c);
      if(c.operateur){ parPers[c.operateur]=parPers[c.operateur]||{n:0,anormal:0,boni:0,ctrl:0}; parPers[c.operateur].n++; parPers[c.operateur].anormal+=e.anormal; parPers[c.operateur].boni+=e.boni; }
      if(c.verif&&c.verif.par){ parPers[c.verif.par]=parPers[c.verif.par]||{n:0,anormal:0,boni:0,ctrl:0}; parPers[c.verif.par].ctrl++; }
      if(c.caisse){ parCaisse[c.caisse]=parCaisse[c.caisse]||{n:0,anormal:0}; parCaisse[c.caisse].n++; parCaisse[c.caisse].anormal+=e.anormal; }
    });
  });
  const pers=Object.entries(parPers).sort((a,b)=>b[1].anormal-a[1].anormal);
  const maxP=Math.max(0.01,...pers.map(x=>x[1].anormal));
  let h=barrePeriode()+'<div class="stats">'+stat("Chiffre d'affaires",eur(ca),"","prim")+
    stat("Manquant cumulé",eur(anormal),"",anormal>0?"ko":"ok")+
    stat("Excédent non-rendu",eur(boni),"",boni>0?"bleu":"")+stat("Titres TR / CV",nTR+" / "+nCV,"","")+
    stat("Journées clôturées",nClo+" / "+cles.length,"",nClo<cles.length?"att":"ok")+'</div>';
  h+='<div class="carte"><header><h2>Par personne</h2></header>'+
    (pers.length?'<table><thead><tr><th>Nom</th><th>Rôle</th><th class="n">Comptages</th><th class="n">Contrôles</th><th class="n">Manquant</th><th class="n">Excédent</th><th style="width:130px">Poids</th></tr></thead><tbody>'+
    pers.map(([n,x])=>{
      const cpt=parNom(n);
      return '<tr><td><b>'+ech(n)+'</b></td><td><span class="pil neu">'+ech(cpt?cpt.role:"Équipier")+'</span></td>'+
      '<td class="n">'+x.n+'</td><td class="n">'+x.ctrl+'</td>'+
      '<td class="n" style="font-weight:600;color:'+(x.anormal>0?"var(--rouge)":"var(--t1)")+'">'+eur(x.anormal)+'</td>'+
      '<td class="n" style="color:var(--bleu)">'+eur(x.boni)+'</td>'+
      '<td><span style="display:block;height:8px;background:var(--bord);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:'+((x.anormal/maxP)*100)+'%;background:'+(x.anormal>0?"var(--rouge)":"var(--prim)")+'"></i></span></td></tr>';
    }).join("")+'</tbody></table></div>':'<div class="vide">Aucun comptage nominatif.</div>')+
    '</div>';
  h+='<div class="carte"><header><h2>Par caisse</h2></header><table><thead><tr><th>Caisse</th><th class="n">Comptages</th><th class="n">Manquant</th><th class="n">Moyenne</th></tr></thead><tbody>'+
    Object.entries(parCaisse).map(([n,x])=>'<tr><td><b>'+ech(n)+'</b></td><td class="n">'+x.n+'</td><td class="n">'+eur(x.anormal)+'</td><td class="n">'+eur(x.anormal/x.n)+'</td></tr>').join("")+'</tbody></table></div></div>';
  return h;
}

  document.body.appendChild(v);
  v.querySelector("#v-fermer").onclick=()=>v.remove();
  v.onclick=e=>{ if(e.target===v) v.remove(); };
  document.addEventListener("keydown",function esc(e){ if(e.key==="Escape"){ v.remove(); document.removeEventListener("keydown",esc); } });
  const corps=v.querySelector(".voile-corps");
  const direct=photosMem[id]||(meta&&meta._brut)||((meta&&meta.type!=="application/pdf")?lienDirect(meta,1600):"");
  let data=direct;
  if(direct){ corps.innerHTML='<img src="'+direct+'" alt="Justificatif">'; }
  else {
    data=await ouvrirDoc(id,meta);
    if(!data){ corps.innerHTML='<span style="color:#98A2B3">Pièce introuvable.</span>'; return; }
    corps.innerHTML=(meta&&meta.type==="application/pdf")?'<iframe src="'+data+'" title="Justificatif"></iframe>':'<img src="'+data+'" alt="Justificatif">';
  }
  v.querySelector("#v-dl").onclick=()=>{
    const a=document.createElement("a"); a.href=data;
    a.download=(meta?meta.libelle.replace(/[^\w-]+/g,"_"):"justificatif")+(meta&&meta.type==="application/pdf"?".pdf":".jpg");
    document.body.appendChild(a); a.click(); a.remove();
  };
}

function surClic(e){
  const t=e.target.closest?e.target.closest(SELECTEURS):null;
  if(!t||t.disabled) return;
  const j=t.dataset||{};
  if(t.id==="j-prec"||t.id==="j-suiv"){
    jour=decale(jour,t.id==="j-prec"?-1:1); brouillon=null; brouillonFerm=null; return peindre();
  }
  if(t.id==="deco") return fermerSession(false);
  if(j.vue!==undefined){
    if(j.vue==="comptage"&&vue!=="comptage") brouillon=null;
    if(j.vue==="fermeture"&&vue!=="fermeture") brouillonFerm=null;
    return aller(j.vue);
  }
  if(j.filtre!==undefined){ filtreValid=j.filtre; indexValid=0; zoomValid=1; rotValid=0; pieceActive=""; return peindre(); }
  if(j.nav!==undefined){
    const l=fileComptages(filtreValid);
    indexValid=Math.min(l.length-1,Math.max(0,indexValid+parseInt(j.nav,10)));
    zoomValid=1; rotValid=0; pieceActive=""; return peindre();
  }
  if(j.zoom!==undefined){
    const z=parseInt(j.zoom,10);
    zoomValid=z===0?1:Math.min(4,Math.max(.4,zoomValid+(z*0.25)));
    const im=document.querySelector("#visu img");
    if(im) im.style.transform="scale("+zoomValid+") rotate("+(rotValid*90)+"deg)";
    return;
  }
  if(j.rot!==undefined){
    rotValid=(rotValid+1)%4;
    const im=document.querySelector("#visu img");
    if(im) im.style.transform="scale("+zoomValid+") rotate("+(rotValid*90)+"deg)";
    return;
  }
  if(j.caisse!==undefined) return actionCaisse(j.caisse);
  if(j.pieceOk!==undefined) return pointerPiece(j.pieceOk,"conforme");
  if(j.pieceKo!==undefined) return pointerPiece(j.pieceKo,"refuse");
  if(j.piece!==undefined){ pieceActive=j.piece; return chargerVisu(true); }
  if(j.depot!==undefined){
    cibleDepot={cible:j.depot, libelle:j.lib};
    const entree=document.getElementById("entree-fichier");
    if(surMobile()){
      entree.accept="image/*"; entree.setAttribute("capture","environment"); entree.multiple=false;
    } else {
      entree.accept="image/*,application/pdf"; entree.removeAttribute("capture"); entree.multiple=true;
    }
    return entree.click();
  }
  if(j.doc!==undefined) return visionner(j.doc);
  if(j.jeter!==undefined) return retirerPreuve(j.jeter);
  if(j.act!==undefined) return agir(j.act,j);
  if(typeof actionsAuth==="function") actionsAuth(t.id);
}

function surSaisie(e){

  if(id==="s-mdp") return jauge("s-jauge",el.value);

    brouillon[CHAMPS_C[id]]=el.value;
    if(el.tagName==="SELECT"||el.type==="time") return peindreVue();

    if(el.tagName==="SELECT") return peindreVue();
    return;

    brouillonFerm.retrait[CHAMPS_R[id]]=el.value;

  if(brouillonFerm&&/^f-(cc|borne|uber|deliveroo)$/.test(id)){

async function basculerDroit(cid,cle,coche){
  const c=COMPTES.find(x=>x.id===cid); if(!c) return;
  if(!c.droits){ c.droits={}; droitsDe(c).forEach(d=>c.droits[d]=true); }
  if(coche) c.droits[cle]=true; else delete c.droits[cle];
  if(cle==="comptes"&&!coche){
    const reste=COMPTES.filter(x=>droitsDe(x).indexOf("comptes")>=0&&x.actif!==false);
    if(!reste.length){ c.droits.comptes=true; toast("Il doit rester une personne capable de gérer les accès.",true); return peindreVue(); }
    if(c.id===SESSION.id){ c.droits.comptes=true; toast("Vous ne pouvez pas retirer votre propre gestion des accès.",true); return peindreVue(); }
  }
  await ecrire(CLES.c,COMPTES);
  tracer("Droit modifié",c.nom+" · "+cle+" "+(coche?"accordé":"retiré"));
  peindreVue();
}

document.getElementById("entree-fichier").addEventListener("change", async e=>{

    try{
      const meta=await rangerDoc(f,cibleDepot.cible,cibleDepot.libelle);
      if(cibleDepot.cible.indexOf("remise:")===0) brouillonRemise.justificatifs=(brouillonRemise.justificatifs||[]).concat([meta]);
      else if(/^(z|tr|cv|cb):/.test(cibleDepot.cible)){
        if(!brouillon){ toast("Ouvrez d'abord le comptage concerné.",true); return; }
        brouillon.justificatifs=(brouillon.justificatifs||[]).concat([meta]);
      } else { const d=journeeEcr(jour); d.justificatifs=d.justificatifs.concat([meta]); await sauver(); }
      tracer("Pièce jointe",cibleDepot.libelle+" · "+courteDate(jour)+" · empreinte "+meta.empreinte);
    }catch(err){ toast(err.message||"Impossible de traiter ce fichier.",true); }

});
async function retirerPreuve(id){
  if(!confirm("Retirer cette pièce ? La suppression reste dans la traçabilité.")) return;
  const oter=l=>{ const i=(l||[]).findIndex(x=>x.id===id); if(i>=0){ const m=l[i]; l.splice(i,1); return m; } return null; };
  let m=null;
  if(brouillon) m=oter(brouillon.justificatifs)||m;
  if(brouillonRemise) m=oter(brouillonRemise.justificatifs)||m;
  const d=journeeEcr(jour); m=oter(d.justificatifs)||m;
  d.comptages.forEach(c=>{ m=oter(c.justificatifs)||m; });
  REMISES.forEach(r=>{ m=oter(r.justificatifs)||m; });
  await jeterDoc(id); await sauver(); await ecrire(CLES.r,REMISES);
  tracer("Pièce retirée",(m?m.libelle:"pièce")+" · "+courteDate(jour));
  toast("Pièce retirée."); peindre();
}

async function agir(a,ds){
  const d=journeeEcr(jour);
  if(a==="mobile-inventaire"){ mobileAccueil=false; return peindre(); }
  if(a==="ouvrir"){
    const m=v("ouv-montant"), par=v("ouv-par");
    if(m==="") return toast("Saisissez le montant du monnayeur.",true);
    if(!par) return toast("Indiquez qui ouvre la journée.",true);
    d.ouverture={montant:nb(m),par,at:maintenant()}; d.statut="ouvert";
    tracer("Ouverture",courteDate(jour)+" · "+eur(m)+" · "+par);
    await sauver();
    if(surMobile()){ mobileAccueil=true; toast("Inventaire enregistré."); return aller("tableau"); }
    toast("Journée ouverte."); return peindre();
  }
  if(a==="corriger-ouverture"){
    if(!peut("corriger")) return toast("Droit « Corriger une ouverture » non accordé.",true);
    const veille=fermetureVeille(jour);
    const m=prompt("Nouveau montant d'ouverture (€) :",d.ouverture.montant); if(m===null) return;
    const mo=prompt("Motif de la correction — obligatoire :",""); if(!mo||!mo.trim()) return toast("Correction refusée : aucun motif.",true);
    const anc=d.ouverture.montant;
    d.ouverture.montant=nb(m); d.ouverture.motifCorrection=mo.trim(); d.ouverture.corrigePar=SESSION.nom; d.ouverture.corrigeAt=maintenant();
    tracer("Correction ouverture",courteDate(jour)+" · "+eur(anc)+" → "+eur(m)+" · "+mo.trim()+(veille!==null?" · fermeture veille "+eur(veille):""));
    await sauver(); toast("Correction enregistrée."); return peindre();
  }
  if(a==="valider-comptage"){
    const pbs=problemesComptage(brouillon); if(pbs.length) return toast(pbs[0],true);
    const e=ecartComptage(brouillon);
    if(!brouillon.id){
      const n=uid();
      (brouillon.justificatifs||[]).forEach(x=>{ x.cible=x.cible.replace(/:nouveau$/,":"+n); });
      brouillon.id=n; brouillon.at=maintenant(); brouillon.saisiPar=SESSION.nom;
      d.comptages.push(Object.assign({},brouillon));
      tracer("Comptage enregistré",courteDate(jour)+" · "+brouillon.caisse+" · "+brouillon.operateur+
        " · TR "+detailTR(brouillon).nb+" tit. · CV "+detailCV(brouillon).nb+" tit. · manquant "+eur(e.anormal));
    } else {
      const i=d.comptages.findIndex(c=>c.id===brouillon.id);
      const anc=d.comptages[i];
      const maj=Object.assign({},brouillon,{modifiePar:SESSION.nom,modifieAt:maintenant()});
      delete maj.renvoi; delete maj.verif; delete maj.valid;
      if(anc.renvoi){
        const m=MESSAGES.find(x=>x.comptageId===anc.id&&!x.resolu);
        if(m){ m.resolu=true; m.resoluLe=maintenant(); ecrire(CLES.m,MESSAGES); }
        pointsControle(jour).forEach(p=>{ if(d.controles[p.id]&&d.controles[p.id].etat==="refuse") delete d.controles[p.id]; });
      }
      d.comptages[i]=maj;
      tracer("Comptage modifié",courteDate(jour)+" · "+brouillon.caisse+" · manquant "+eur(e.anormal));
    }
    const ancienneCaisse=brouillon.caisse, ancienService=brouillon.service;
    brouillon=neufComptage();
    const idx=P.caisses.indexOf(ancienneCaisse);
    brouillon.caisse=P.caisses[(idx+1)%P.caisses.length]||ancienneCaisse;
    brouillon.service=ancienService;
    await sauver();
    if(surMobile()){
      brouillon=null; mobileAccueil=true;
      toast(e.anormal===0?"Caisse enregistrée.":"Caisse enregistrée · manquant "+eur(e.anormal)+".");
      return aller("tableau");
    }
    toast(e.anormal===0?"Enregistré. Caisse suivante.":"Enregistré avec "+eur(e.anormal)+" de manquant. Caisse suivante.");
    return peindre();
  }
  if(a==="voir-comptage"){ brouillon=JSON.parse(JSON.stringify(d.comptages.find(c=>c.id===ds.id))); return aller("comptage"); }
  if(a==="annuler-comptage"){ brouillon=null; return aller("tableau"); }
  if(a==="supprimer-comptage"){
    if(!peut("supprimer")) return toast("Droit « Supprimer un comptage » non accordé.",true);
    if(!confirm("Supprimer ce comptage ?")) return;
    d.comptages=d.comptages.filter(c=>c.id!==brouillon.id);
    tracer("Comptage supprimé",courteDate(jour)+" · "+brouillon.caisse+" · "+brouillon.operateur);
    brouillon=null; await sauver(); toast("Comptage supprimé."); return aller("tableau");
  }
  if(a==="enregistrer-fermeture"){
    const f=brouillonFerm;
    const montant=nb(f.montant);
    if(!montant) return toast("Saisissez le total du monnayeur.",true);
    if(!f.par) return toast("Indiquez qui a fait la fermeture.",true);
    d.fermeture={montant,par:f.par,at:maintenant()};
    d.especesZ=nb(f.especesZ); d.tpe1=nb(f.tpe1); d.tpe2=nb(f.tpe2);
    if(peut("remises")){
      d.apport=nb(f.apport);
      d.retrait={montant:nb(f.retrait.montant),bordereau:f.retrait.bordereau,par:f.retrait.par,controlePar:""};
    }
    d.canaux={cc:nb(f.canaux.cc),borne:nb(f.canaux.borne),uber:nb(f.canaux.uber),deliveroo:nb(f.canaux.deliveroo)};
    tracer("Fermeture enregistrée",courteDate(jour)+" · monnayeur "+eur(montant)+" · "+f.par+
      (nb(f.retrait.montant)>0?" · retrait "+eur(f.retrait.montant)+" bord. "+(f.retrait.bordereau||"MANQUANT"):""));
    await sauver();
    if(surMobile()){ brouillonFerm=null; mobileAccueil=true; toast("Fermeture enregistrée."); return aller("tableau"); }
    toast("Fermeture enregistrée."); return peindre();
  }
  if(a==="cloturer"){
    if(!peut("cloturer")) return toast("Droit « Clôturer la journée » non accordé.",true);
    if(!toutValide(jour)) return toast("Toutes les caisses doivent être validées avant la clôture.",true);
    const f=brouillonFerm, b=bilan(jour);
    const pbs=problemesFermeture(f,d.fermeture?nb(d.fermeture.montant):0);
    if(pbs.length) return toast(pbs[0],true);
    d.cloture={par:SESSION.nom,at:maintenant()}; d.statut="cloture";
    tracer("Journée clôturée",courteDate(jour)+" · CA "+eur(b.caReel)+" · manquant "+eur(b.anormal)+" · excédent "+eur(b.boni));
    brouillonFerm=null; await sauver(); toast("Journée clôturée."); return aller("tableau");
  }
  if(a==="periode"){ periode=ds.p; return peindreVue(); }
  if(a==="journal-detail"){ journalDetail=!journalDetail; return peindreVue(); }
  if(a==="voir-jour"||a==="aller-msg"){ jour=ds.jour; brouillon=null; brouillonFerm=null; return aller("tableau"); }

  if(a==="envoyer-msg"){
    const pour=v("msg-pour"), suj=v("msg-sujet").trim(), txt=v("msg-texte").trim();
    if(!pour) return toast("Choisissez un destinataire.",true);
    if(!txt) return toast("Écrivez votre message.",true);
    await envoyerMessage({pour, sujet:suj||"Message", jour:"", pointId:"", comptageId:"", texte:txt});
    tracer("Message envoyé","à "+pour+" : "+(suj||"sans sujet"));
    toast("Message envoyé à "+pour+"."); return peindre();
  }
  if(a==="stock-periode"){ filtreDu=""; filtreAu=""; return peindreVue(); }
  if(a==="stock-tout"){ filtreDu="1970-01-01"; filtreAu="2999-12-31"; return peindreVue(); }
  if(a==="repondre-msg"){
    const m=MESSAGES.find(x=>x.id===ds.id);
    const t=prompt("Votre réponse :",""); if(!t||!t.trim()) return;
    m.reponses=(m.reponses||[]).concat([{at:maintenant(),de:SESSION.nom,texte:t.trim()}]);
    m.lu=true; await ecrire(CLES.m,MESSAGES);
    tracer("Réponse à un retour",m.sujet); toast("Réponse envoyée."); return peindre();
  }
  if(a==="resoudre-msg"){
    const m=MESSAGES.find(x=>x.id===ds.id);
    m.resolu=true; m.lu=true; m.resoluLe=maintenant(); await ecrire(CLES.m,MESSAGES);
    const dd=journeeEcr(m.jour);
    if(dd.controles[m.pointId]) delete dd.controles[m.pointId];
    await sauver();
    tracer("Retour traité",m.sujet+" — la pièce repasse en attente de validation");
    toast("Marqué comme corrigé : la pièce repasse dans la file de validation."); return peindre();
  }

  if(a==="ajout-remise"){
    const r=brouillonRemise;
    if(!nb(r.montant)) return toast("Saisissez le montant facial.",true);
    if(!r.bordereau) return toast("Le n° de bordereau est obligatoire.",true);
    if(!(r.justificatifs||[]).length) return toast("Joignez la photo du bordereau d'envoi.",true);
    const id=uid();
    (r.justificatifs||[]).forEach(x=>{ x.cible="remise:"+id; });
    REMISES.push({id, type:r.type, emetteur:r.emetteur, dateEnvoi:r.dateEnvoi, nbTitres:ent(r.nbTitres),
      montant:nb(r.montant), bordereau:r.bordereau, commission:nb(r.commission), statut:"envoyee",
      montantRecu:0, dateRembours:"", par:SESSION.nom, at:maintenant(), justificatifs:r.justificatifs||[]});
    await ecrire(CLES.r,REMISES);
    tracer("Remise enregistrée",r.type+" · "+r.emetteur+" · "+eur(r.montant)+" · bord. "+r.bordereau);
    brouillonRemise=null; toast("Remise enregistrée."); return peindre();
  }
  if(a==="solder-remise"){
    const r=REMISES.find(x=>x.id===ds.id);
    const m=prompt("Montant réellement reçu (€) :",arrondi(nb(r.montant)-nb(r.commission))); if(m===null) return;
    r.montantRecu=nb(m); r.dateRembours=isoAujourdhui(); r.statut="remboursee"; r.pointePar=SESSION.nom;
    await ecrire(CLES.r,REMISES);
    const att=arrondi(nb(r.montant)-nb(r.commission));
    tracer("Remise pointée",r.emetteur+" · attendu "+eur(att)+" · reçu "+eur(m)+(Math.abs(nb(m)-att)>0.02?" · ÉCART":""));
    toast(Math.abs(nb(m)-att)>0.02?"Écart de "+eur(nb(m)-att)+" détecté.":"Remise pointée, montant conforme."); return peindre();
  }
  if(a==="suppr-remise"){
    if(!peut("remises")) return toast("Droit « Remises » non accordé.",true);
    if(!confirm("Supprimer cette remise ?")) return;
    const r=REMISES.find(x=>x.id===ds.id);
    REMISES=REMISES.filter(x=>x.id!==ds.id); await ecrire(CLES.r,REMISES);
    tracer("Remise supprimée",r.emetteur+" · "+eur(r.montant)); toast("Remise supprimée."); return peindre();
  }

  if(a==="ouvrir-droits"){ compteOuvert=(compteOuvert===ds.id)?"":ds.id; return peindreVue(); }
  if(a==="reset-droits"){
    const c=COMPTES.find(x=>x.id===ds.id); if(!c) return;
    delete c.droits; await ecrire(CLES.c,COMPTES);
    tracer("Droits rétablis",c.nom+" suit de nouveau le rôle "+c.role);
    toast(c.nom+" suit de nouveau les droits du rôle "+c.role+"."); return peindreVue();
  }
  if(a==="creer-acces"){
    const nom=v("u-nom").trim(), mail=v("u-mail").trim(), role=v("u-role"), mdp=v("u-mdp"), rep=v("u-rep").trim();
    if(!nom) return toast("Indiquez le nom de la personne.",true);
    if(!emailOK(mail)) return toast("Adresse e-mail invalide.",true);
    if(parEmail(mail)) return toast("Un compte existe déjà avec cette adresse.",true);
    if(mdp.length<10) return toast("Le mot de passe doit faire au moins 10 caractères.",true);
    if(mdp!==v("u-mdp2")) return toast("Les deux mots de passe ne correspondent pas.",true);
    if(!rep) return toast("La réponse de secours est obligatoire.",true);
    if(role==="Administrateur"&&!codeMaitreOK(prompt("Créer un administrateur exige le code maître :",""))) return toast("Code maître incorrect.",true);
    await creerCompte({nom,email:mail,role,mdp,question:v("u-q"),reponse:rep});
    toast(nom+" a désormais un accès "+role+"."); return peindre();
  }
  if(a==="mdp-compte"){
    const c=COMPTES[parseInt(ds.i,10)];
    if(c.role==="Administrateur"&&!codeMaitreOK(prompt("Changer le mot de passe d'un administrateur exige le code maître :",""))) return toast("Code maître incorrect.",true);
    const m=prompt("Nouveau mot de passe pour "+c.nom+" — 10 caractères minimum :",""); if(m===null) return;
    if(m.length<10) return toast("Mot de passe trop court.",true);
    c.sel=selAleatoire(); c.hMdp=deriver(m,c.sel); c.mdpChangeLe=maintenant(); c.mdpChangePar=SESSION.nom;
    await ecrire(CLES.c,COMPTES);
    tracer("Mot de passe réinitialisé",c.nom+" · "+c.email+" · par "+SESSION.nom);
    toast("Mot de passe changé. Communiquez-le à "+c.nom+"."); return peindre();
  }
  if(a==="basculer-compte"){
    const c=COMPTES[parseInt(ds.i,10)];
    if(c.id===SESSION.id) return toast("Vous ne pouvez pas désactiver votre propre compte.",true);
    if(c.role==="Administrateur"&&c.actif!==false&&COMPTES.filter(x=>x.role==="Administrateur"&&x.actif!==false).length<2)
      return toast("Il doit rester au moins un administrateur actif.",true);
    c.actif=(c.actif===false); await ecrire(CLES.c,COMPTES);
    tracer("Compte "+(c.actif?"réactivé":"désactivé"),c.nom+" · "+c.email);
    toast(c.nom+(c.actif?" réactivé.":" désactivé.")); return peindre();
  }
  if(a==="suppr-compte"){
    const c=COMPTES[parseInt(ds.i,10)];
    if(c.id===SESSION.id) return toast("Vous ne pouvez pas supprimer votre propre compte.",true);
    if(c.role==="Administrateur"&&COMPTES.filter(x=>x.role==="Administrateur").length<2) return toast("Il doit rester au moins un administrateur.",true);
    if(!confirm("Supprimer le compte de "+c.nom+" ? Les comptages à son nom sont conservés.")) return;
    COMPTES=COMPTES.filter(x=>x.id!==c.id); await ecrire(CLES.c,COMPTES);
    tracer("Compte supprimé",c.nom+" · "+c.email); toast("Compte supprimé."); return peindre();
  }
  if(a==="save-params"){
    P.site=v("r-site")||"BSM"; P.delaiRembours=ent(v("r-del")); P.verrouMinutes=ent(v("r-vm"));
    const cr=document.getElementById("r-2tpe"); P.deuxTPE=cr?cr.checked:true;
    await ecrire(CLES.p,P); tracer("Paramètres modifiés",P.site);
    toast("Paramètres enregistrés."); return peindre();
  }
  if(a==="save-listes"){
    const L=id=>v(id).split("\n").map(s=>s.trim()).filter(Boolean);
    const c=L("r-caisses"), s=L("r-services"), vt=L("r-vtr").map(nb).filter(x=>x>0), vc=L("r-vcv").map(nb).filter(x=>x>0);
    if(!c.length||!s.length||!vt.length||!vc.length) return toast("Chaque liste doit contenir au moins une valeur.",true);
    P.caisses=c; P.services=s; P.valeursTR=vt.sort((a,b)=>a-b); P.valeursCV=vc.sort((a,b)=>a-b);
    P.emetteursTR=L("r-emet"); P.equipiers=L("r-equipiers");
    await ecrire(CLES.p,P); tracer("Listes modifiées",c.length+" caisses · "+vt.length+" valeurs TR");
    toast("Listes enregistrées."); return peindre();
  }
  if(a==="export-json"){
    telecharger("sauvegarde-caisse-"+isoAujourdhui()+".json",
      JSON.stringify({version:4,exporteLe:maintenant(),exportePar:SESSION.nom,params:P,comptes:COMPTES,journal:J,remises:REMISES,messages:MESSAGES,audit:AUDIT},null,2),"application/json");
    tracer("Export sauvegarde",Object.keys(J).length+" journées");
    return toast("Sauvegarde exportée (sans les photos).");
  }
  if(a==="export-csv"){ telecharger("controle-caisse-"+isoAujourdhui()+".csv",construireCSV(),"text/csv"); return toast("CSV exporté."); }
  if(a==="import-json"){ return document.getElementById("entree-restaure").click(); }
  if(a==="sv-tester"){
    const url=v("sv-url").trim(), cle=v("sv-cle").trim();
    if(!url) return toast("Collez l'adresse du script Google.",true);
    const anc=Object.assign({},cfgServeur);
    cfgServeur={url,cle};
    try{
      const r=await tirerTout(); syncActif=true;
      await ecrireLocal("caisse:serveur",cfgServeur);
      tracer("Serveur connecté",url.slice(0,60)+(r.amorce?" · amorçage depuis cet appareil":" · données reçues"));
      toast(r.amorce?"Connecté. Le serveur était vide : vos données ont été envoyées."
                   :"Connecté. Les données du serveur ont été chargées.");
      return peindre();
    }catch(e){ cfgServeur=anc; syncActif=false; return toast("Connexion impossible : "+e.message,true); }
  }
  if(a==="sv-envoyer"){
    if(!confirm("Envoyer les journées, comptes, remises et messages de cet appareil vers le serveur ?\nLes enregistrements portant le même identifiant seront remplacés.")) return;
    try{
      await envoyerTout();
      tracer("Envoi vers le serveur",Object.keys(J).length+" journées");
      toast("Données envoyées au serveur."); return peindre();
    }catch(e){ return toast("Envoi impossible : "+e.message,true); }
  }
  if(a==="sv-miroir"){
    try{
      const r=await appelServeur({action:"miroir"});
      lienDrive={classeur:r.url||"",dossier:r.dossier||""};
      toast("Classeur mis à jour : "+(r.lignes||0)+" lignes.");
      return peindre();
    }catch(e){ return toast("Mise à jour impossible : "+e.message,true); }
  }
  if(a==="sv-fichier"){
    try{
      const rep=await fetch(location.href);
      let src=await rep.text();
      if(src.indexOf("const SERVEUR=")<0) throw new Error("source introuvable");
      src=src.replace(/const SERVEUR=\{[^}]*\};/,
        'const SERVEUR={ url:"'+cfgServeur.url+'", cle:"'+cfgServeur.cle+'" };');
      telecharger("Controle-Caisse-"+(P.site||"BSM")+".html",src,"text/html");
      tracer("Fichier configuré exporté",cfgServeur.url.slice(0,60));
      toast("Fichier prêt : distribuez-le, il se connectera seul.");
    }catch(e){
      toast("Copie impossible depuis ce contexte. Utilisez la ligne à copier ci-dessous.",true);
    }
    return;
  }
  if(a==="sv-copier"){
    const t=document.getElementById("ligne-serveur");
    if(!t) return;
    try{ await navigator.clipboard.writeText(t.textContent); toast("Ligne copiée."); }
    catch(e){
      const r=document.createRange(); r.selectNodeContents(t);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Sélectionnée : copiez-la avec Ctrl+C.");
    }
    return;
  }
  if(a==="sv-etat"){
    try{
      const r=await appelServeur({action:"etat"});
      lienDrive={classeur:r.classeur||"",dossier:r.dossier||""};
      toast(r.journees+" journée(s), "+r.comptes+" compte(s), "+r.remises+" remise(s) sur le serveur.");
      return peindre();
    }catch(e){ return toast("Serveur injoignable : "+e.message,true); }
  }
  if(a==="sv-couper"){
    if(!confirm("Repasser en mode local sur cet appareil ?")) return;
    syncActif=false; cfgServeur={url:"",cle:""}; await ecrireLocal("caisse:serveur",cfgServeur);
    tracer("Serveur déconnecté",""); toast("Mode local rétabli."); return peindre();
  }
  if(a==="tout-effacer"){
    if(!confirm("Effacer TOUTES les données d'exploitation, photos comprises ?")) return;
    if(prompt('Tapez EFFACER pour confirmer :')!=="EFFACER") return toast("Rien n'a été effacé.");
    const ids=[];
    Object.keys(J).forEach(k=>{ (J[k].justificatifs||[]).forEach(x=>ids.push(x.id)); J[k].comptages.forEach(c=>(c.justificatifs||[]).forEach(x=>ids.push(x.id))); });
    REMISES.forEach(r=>(r.justificatifs||[]).forEach(x=>ids.push(x.id)));
    for(const i of ids) await jeterDoc(i);
    J={}; REMISES=[]; MESSAGES=[];
    await ecrire(CLES.j,J); await ecrire(CLES.r,REMISES); await ecrire(CLES.m,MESSAGES);
    tracer("Effacement total",ids.length+" pièces supprimées"); toast("Données effacées."); return aller("tableau");
  }
}

function telecharger(nom,contenu,type){
  const b=new Blob([type.indexOf("csv")>-1?"\uFEFF"+contenu:contenu],{type:type+";charset=utf-8"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=nom; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},600);
}
function construireCSV(){
  const s=";", num=x=>typeof x==="number"?String(x).replace(".",","):x, L=[];
  L.push(["Date","Service","Caisse","Tenue par","Debut","Fin",
    "Nb TR","Montant TR","TR ticket Z","Ecart TR",
    "Nb CV","Montant CV","CV ticket Z","Ecart CV",
    "CB caisse","CB ticket Z","Ecart CB","Manquant","Excedent","Motif",
    "Verifiee par","Validee par","Etape"].join(s));
  Object.keys(J).sort().forEach(k=>(J[k].comptages||[]).forEach(c=>{
    const t=detailTR(c), v=detailCV(c), e=ecartComptage(c);
    L.push([courteDate(k),c.service,c.caisse,c.operateur,c.h1,c.h2,
      t.nb,t.physique,t.z,t.ecart, v.nb,v.physique,v.z,v.ecart,
      nb(c.cb),nb(c.cbZ),e.cb,e.anormal,e.boni,
      String(c.motif||"").replace(/[;\n\r]/g," "),
      c.verif?c.verif.par:"", c.valid?c.valid.par:"", ETAPES[etapeComptage(c)].l].map(num).join(s));
  }));
  L.push("");
  L.push(["Date","Statut","Ouverture","Fermeture","Apport","Retrait","Bordereau","Especes reelles","Especes Z",
    "Ecart especes","TPE 1","TPE 2","Ecart TPE","Nb TR","Nb CV","Manquant","Excedent","CA reel","CA theorique",
    "Photos validees","Photos attendues","Cloture par"].join(s));
  Object.keys(J).sort().forEach(k=>{
    const d=J[k], b=bilan(k), cc=controleComplet(k);
    L.push([courteDate(k),d.cloture?"Cloturee":(d.ouverture?"En cours":"—"),b.ouv,b.fer,b.app,b.ret,d.retrait.bordereau||"",
      b.especesReelles,nb(d.especesZ),b.ecartEspeces,nb(d.tpe1),nb(d.tpe2),b.ecartTPE,
      b.nTR,b.nCV,b.anormal,b.boni,b.caReel,b.caTheo,cc.ok,cc.total,
      d.cloture?d.cloture.par:""].map(num).join(s));
  });
  L.push("");
  L.push(["Remise - envoi","Type","Emetteur","Bordereau","Nb titres","Montant facial","Commission","Statut","Date remboursement","Montant recu","Ecart"].join(s));
  REMISES.forEach(r=>{
    const a=arrondi(nb(r.montant)-nb(r.commission));
    L.push([courteDate(r.dateEnvoi),r.type,r.emetteur,r.bordereau,ent(r.nbTitres),nb(r.montant),nb(r.commission),
      r.statut,r.dateRembours?courteDate(r.dateRembours):"",nb(r.montantRecu),
      r.statut==="remboursee"?arrondi(nb(r.montantRecu)-a):""].map(num).join(s));
  });
  L.push("");
  const st=stockTotal();
  L.push(["Stock actuel","Nb TR",st.TRn,"Montant TR",String(st.TRm).replace(".",","),
    "Nb CV",st.CVn,"Montant CV",String(st.CVm).replace(".",",")].join(s));
  return L.join("\r\n");
}
document.getElementById("entree-restaure").addEventListener("change",e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const o=JSON.parse(fr.result);
      if(!o.journal) throw new Error("format");
      if(!confirm("Remplacer les données actuelles ?\nLes photos déjà stockées ne seront pas restaurées.")) return;
      P=Object.assign(JSON.parse(JSON.stringify(PARAMS_DEFAUT)),o.params||{});
      if(o.comptes&&o.comptes.length) COMPTES=o.comptes;
      J=o.journal||{}; REMISES=o.remises||[]; MESSAGES=o.messages||[]; AUDIT=o.audit||[];
      await ecrire(CLES.p,P); await ecrire(CLES.c,COMPTES); await ecrire(CLES.j,J);
      await ecrire(CLES.r,REMISES); await ecrire(CLES.m,MESSAGES); await ecrire(CLES.a,AUDIT);
      tracer("Sauvegarde restaurée",Object.keys(J).length+" journées");
      toast("Sauvegarde restaurée."); peindre();
    }catch(err){ toast("Fichier illisible : ce n'est pas une sauvegarde de cette application.",true); }
  };
  fr.readAsText(f);
});

(async function demarrer(){
  const loc=await lire("caisse:serveur",null);
  if(loc&&loc.url) cfgServeur=loc;
  await chargerLocal();
  if(COMPTES.length){ ecranAuth="connexion"; peindre(); }
  else if(!cfgServeur.url){ ecranAuth="base"; peindre(); }
  if(cfgServeur.url){
    try{ await tirerTout(); syncActif=true; }
    catch(e){
      syncActif=false; syncEtat="erreur"; syncErreur=e.message;
      if(!COMPTES.length){ ecranAuth="base"; authErr="Base injoignable : "+e.message; }
    }
  }
  if(syncActif||modeLocalAccepte||COMPTES.length) ecranAuth="connexion";
  if(!SESSION) peindre();
})();

</script>
